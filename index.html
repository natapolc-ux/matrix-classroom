<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{

  width:320px;

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgba(0,0,0,0.85);

  border:
    1px solid #00ff41;

  padding:30px;

  box-shadow:
    0 0 20px #00ff41;
}

h2{
  text-align:center;
}

input,
select,
button{

  width:100%;

  padding:12px;

  margin-top:10px;

  background:black;

  border:
    1px solid #00ff41;

  color:#00ff41;

  box-sizing:border-box;
}

button{
  cursor:pointer;
}

button:hover{
  background:#00ff41;
  color:black;
}

#msg{
  text-align:center;
  margin-top:10px;
}

.card{

  border:
    1px solid #00ff41;

  margin-top:20px;

  padding:20px;

  background:#111;

  box-shadow:
    0 0 15px #00ff41;
}

img{
  max-width:250px;
  border:1px solid #00ff41;
  margin-top:10px;
}

.work-text{

  background:black;

  border:
    1px solid #00ff41;

  padding:15px;

  margin-top:10px;

  white-space:pre-wrap;

  line-height:1.6;

  font-family:monospace;
}

.dashboard{
  padding:20px;
}

.logout-btn{
  max-width:200px;
}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h2>LOGIN</h2>

<input
  type="text"
  id="id"
  placeholder="Student ID">

<input
  type="password"
  id="pass"
  placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<p id="msg"></p>

</div>

<!-- TEACHER PANEL -->

<div
  id="teacherPanel"
  class="dashboard"
  style="display:none;">

<h1>Teacher Dashboard</h1>

<button
  class="logout-btn"
  onclick="logout()">

Logout

</button>

<br><br>

<select id="topic"></select>

<select id="classFilter">

<option value="">
ทุกห้อง
</option>

</select>

<input
  type="number"
  id="noFilter"
  placeholder="เลขที่">

<button onclick="loadWork()">
โหลดงาน
</button>

<div id="work"></div>

</div>

<!-- STUDENT PANEL -->

<div
  id="studentPanel"
  class="dashboard"
  style="display:none;">

<h1>Student Dashboard</h1>

<button
  class="logout-btn"
  onclick="logout()">

Logout

</button>

<div id="studentData"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzeqAOJCH6DYu7_A0VzscY5mWYn4uXwGMzxsnmFaB00knp7CI4RBfS_EXI6P00OmXbhvQ/exec";

/* =========================
   SESSION LOGIN
========================= */

window.onload = function(){

  const user =
    JSON.parse(
      localStorage.getItem("user")
    );

  if(user){

    document
      .getElementById("loginBox")
      .style.display = "none";

    if(user.role == "teacher"){

      document
        .getElementById("teacherPanel")
        .style.display = "block";

      loadTopics();
    }

    else{

      document
        .getElementById("studentPanel")
        .style.display = "block";

      document
        .getElementById("studentData")
        .innerHTML =
        "Welcome " + user.name;
    }
  }
}

/* =========================
   LOGIN
========================= */

function login(){

  const id =
    document
      .getElementById("id")
      .value;

  const pass =
    document
      .getElementById("pass")
      .value;

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + id
    + "&pass=" + pass
  )

  .then(res => res.json())

  .then(data => {

    if(data.status == "success"){

      localStorage.setItem(
        "user",
        JSON.stringify(data)
      );

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(data.role == "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
      }

      else{

        document
          .getElementById("studentPanel")
          .style.display = "block";

        document
          .getElementById("studentData")
          .innerHTML =
          "Welcome " + data.name;
      }
    }

    else{

      document
        .getElementById("msg")
        .innerHTML =
        "❌ LOGIN FAILED";
    }

  })

  .catch(err => {

    document
      .getElementById("msg")
      .innerHTML =
      "⚠️ API ERROR";

  });

}

/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem("user");

  location.reload();
}

/* =========================
   LOAD TOPICS
========================= */

function loadTopics(){

  fetch(
    API_URL
    + "?action=topics"
  )

  .then(res => res.json())

  .then(data => {

    let html = "";

    data.forEach(t => {

      html += `
      <option value="${t.url}">
      ${t.level} - ${t.topic}
      </option>
      `;
    });

    document
      .getElementById("topic")
      .innerHTML = html;
  });
}

/* =========================
   LOAD WORK
========================= */

function loadWork(){

  const url =
    document
      .getElementById("topic")
      .value;

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
  )

  .then(res => res.json())

  .then(data => {

    let html = "";

    const classFilter =
      document
        .getElementById("classFilter")
        .value;

    const noFilter =
      document
        .getElementById("noFilter")
        .value;

    data.forEach(s => {

      if(
        classFilter &&
        s.class != classFilter
      )
      return;

      if(
        noFilter &&
        s.no != noFilter
      )
      return;

      html += `

      <div class="card">

      <p>
      ส่งเมื่อ:
      ${s.timestamp}
      </p>

      <h3>
      ${s.class}
      เลขที่ ${s.no}
      </h3>

      <p>${s.name}</p>

      ${
        s.work.includes("http")

        ?

        `<img
          loading="lazy"
          src="${s.work}">`

        :

        `<div class="work-text">
          ${s.work}
        </div>`
      }

      <br><br>

      <input
        type="number"
        id="score_${s.id}"
        value="${s.score || ''}"
        placeholder="คะแนน">

      <button
        onclick="saveScore(
          '${url}',
          '${s.id}'
        )">

      บันทึกคะแนน

      </button>

      </div>
      `;
    });

    document
      .getElementById("work")
      .innerHTML = html;

  });

}

/* =========================
   SAVE SCORE
========================= */

function saveScore(
  url,
  studentId
){

  const score =
    document
      .getElementById(
        "score_" + studentId
      )
      .value;

  fetch(
    API_URL
    + "?action=updateScore"
    + "&url="
    + encodeURIComponent(url)
    + "&studentId="
    + studentId
    + "&score="
    + score
  )

  .then(res => res.json())

  .then(data => {

    if(
      data.status == "success"
    ){

      alert(
        "บันทึกคะแนนแล้ว"
      );
    }

    else{

      alert("ผิดพลาด");
    }

  });

}

/* =========================
   MATRIX EFFECT
========================= */

const canvas =
  document.getElementById("matrix");

const ctx =
  canvas.getContext("2d");

canvas.width =
  window.innerWidth;

canvas.height =
  window.innerHeight;

const letters =
  "アイウエオカキクケコ0123456789";

const fontSize = 16;

const columns =
  Math.floor(
    canvas.width / fontSize
  );

const drops = [];

for(
  let i = 0;
  i < columns;
  i++
){
  drops[i] = 1;
}

function draw(){

  ctx.fillStyle =
    "rgba(0,0,0,0.05)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle =
    "#00ff41";

  ctx.font =
    fontSize
    + "px monospace";

  for(
    let i = 0;
    i < drops.length;
    i++
  ){

    const text =
      letters[
        Math.floor(
          Math.random()
          * letters.length
        )
      ];

    ctx.fillText(
      text,
      i * fontSize,
      drops[i] * fontSize
    );

    if(
      drops[i] * fontSize
      > canvas.height
      &&
      Math.random() > 0.975
    ){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw,33);

window.addEventListener(
  "resize",
  () => {

    canvas.width =
      window.innerWidth;

    canvas.height =
      window.innerHeight;
  }
);

</script>

</body>
</html>
