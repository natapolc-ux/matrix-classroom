<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{
  width:300px;
  margin:100px auto;
  background:rgba(0,0,0,0.8);
  border:1px solid #00ff41;
  padding:20px;
  box-shadow:0 0 20px #00ff41;
}

input,select,button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:10px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
}

button{
  cursor:pointer;
}

button:hover{
  background:#00ff41;
  color:black;
}

.card{
  border:1px solid #00ff41;
  margin:20px 0;
  padding:20px;
  background:rgba(17,17,17,0.95);
  box-shadow:0 0 15px #00ff41;
}

.card img{
  display:block;
  max-width:320px;
  max-height:320px;
  margin-top:10px;
  border:1px solid #00ff41;
  background:#000;
}

.status-box{
  margin-top:15px;
  padding:10px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.8);
}

.panel{
  display:none;
  padding:20px;
  max-width:1000px;
  margin:auto;
}

h2{
  text-shadow:0 0 10px #00ff41;
}

</style>

</head>
<body>

<canvas id="matrix"></canvas>

<div class="login-box" id="loginBox">

  <h2>LOGIN</h2>

  <input id="id" placeholder="Student ID">

  <input
    id="pass"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    เข้าสู่ระบบ
  </button>

  <p id="msg"></p>

</div>


<div id="teacherPanel" class="panel">

  <h2>Teacher Dashboard</h2>

  <select id="topic">
    <option value="">กำลังโหลดหัวข้องาน...</option>
  </select>

  <select id="classFilter">
    <option value="">ทุกห้อง</option>
  </select>

  <input
    id="noFilter"
    type="number"
    placeholder="เลขที่"
  >

  <button onclick="loadWork()">
    โหลดงาน
  </button>

  <div id="workStatus"></div>

  <div id="work"></div>

</div>


<div id="studentPanel" class="panel">

  <h2>Student Dashboard</h2>

  <div id="studentData"></div>

</div>


<script>

// ใส่ URL Apps Script Web App ของคุณตรงนี้
const API_URL = "https://script.google.com/macros/s/AKfycbxmB9iF6TqzPjwIEe-ByRYpC6uIQoNsQmaZN0sCWm9GjFRR6m6ye7INPMR-dFJgo9CCVg/exec";

let currentWorkData = [];


// ===============================
// LOGIN
// ===============================
function login(){

  const id = document
    .getElementById("id")
    .value
    .trim();

  const pass = document
    .getElementById("pass")
    .value
    .trim();

  const msg = document.getElementById("msg");

  if(!id || !pass){
    msg.innerHTML = "❌ กรุณากรอก ID และ Password";
    return;
  }

  msg.innerHTML = "กำลังเข้าสู่ระบบ...";

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + encodeURIComponent(id)
    + "&pass=" + encodeURIComponent(pass)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(data.role === "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
      }

      else{

        document
          .getElementById("studentPanel")
          .style.display = "block";

        document
          .getElementById("studentData")
          .innerHTML =
          "<div class='status-box'>Welcome " + data.name + "</div>";
      }
    }

    else{
      msg.innerHTML =
        "❌ " + (data.message || "Login Failed");
    }
  })

  .catch(error => {
    console.error(error);
    msg.innerHTML = "❌ เชื่อมต่อ API ไม่สำเร็จ";
  });
}


// ===============================
// โหลดหัวข้องาน
// ===============================
function loadTopics(){

  const topicSelect = document.getElementById("topic");

  topicSelect.innerHTML =
    `<option value="">กำลังโหลดหัวข้องาน...</option>`;

  fetch(API_URL + "?action=topics")

  .then(res => res.json())

  .then(response => {

    if(response.status !== "success"){
      topicSelect.innerHTML =
        `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;
      return;
    }

    const data = response.data;

    if(!data || data.length === 0){
      topicSelect.innerHTML =
        `<option value="">ยังไม่มีหัวข้องาน</option>`;
      return;
    }

    let html = `<option value="">-- เลือกหัวข้องาน --</option>`;

    data.forEach(t => {

      html += `
        <option value="${escapeHtml(t.url)}">
          ${escapeHtml(t.level)} - ${escapeHtml(t.topic)}
        </option>
      `;
    });

    topicSelect.innerHTML = html;
  })

  .catch(error => {
    console.error(error);
    topicSelect.innerHTML =
      `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;
  });
}


// ===============================
// โหลดงานนักเรียน
// ===============================
function loadWork(){

  const url = document
    .getElementById("topic")
    .value;

  const workBox = document.getElementById("work");
  const workStatus = document.getElementById("workStatus");

  if(!url){
    workStatus.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกหัวข้องานก่อน</div>`;
    workBox.innerHTML = "";
    return;
  }

  workStatus.innerHTML =
    `<div class="status-box">กำลังโหลดงาน...</div>`;

  workBox.innerHTML = "";

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
  )

  .then(res => res.json())

  .then(response => {

    if(response.status !== "success"){

      workStatus.innerHTML =
        `<div class="status-box">❌ โหลดงานไม่สำเร็จ: ${escapeHtml(response.message || "Unknown error")}</div>`;

      return;
    }

    currentWorkData = response.data || [];

    if(currentWorkData.length === 0){

      workStatus.innerHTML =
        `<div class="status-box">ยังไม่มีข้อมูลงานนักเรียนในชีทนี้</div>`;

      return;
    }

    populateClassFilter(currentWorkData);

    workStatus.innerHTML =
      `<div class="status-box">พบงานทั้งหมด ${currentWorkData.length} รายการ</div>`;

    renderWorkCards(currentWorkData, url);
  })

  .catch(error => {

    console.error(error);

    workStatus.innerHTML =
      `<div class="status-box">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ API</div>`;
  });
}


// ===============================
// แสดงการ์ดงาน พร้อมใช้ตัวกรอง
// ===============================
function renderWorkCards(data, url){

  const workBox = document.getElementById("work");

  const classFilter =
    document
    .getElementById("classFilter")
    .value;

  const noFilter =
    document
    .getElementById("noFilter")
    .value;

  let html = "";

  data.forEach(s => {

    if(
      classFilter &&
      String(s.class) !== String(classFilter)
    ){
      return;
    }

    if(
      noFilter &&
      String(s.no) !== String(noFilter)
    ){
      return;
    }

    const imageUrl = convertDriveImageUrl(s.image);

    html += `

      <div class="card">

        <h3>
          ${escapeHtml(s.class)}
          เลขที่ ${escapeHtml(s.no)}
        </h3>

        <p>ชื่อ: ${escapeHtml(s.name)}</p>
        <p>รหัสนักเรียน: ${escapeHtml(s.id)}</p>

        ${
          imageUrl
          ? `
            <img
              src="${escapeHtml(imageUrl)}"
              alt="Student work"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            >
            <p style="display:none;">❌ แสดงรูปไม่ได้ กรุณาตรวจลิงก์รูปหรือสิทธิ์การแชร์</p>
          `
          : `<p>ไม่มีลิงก์รูป</p>`
        }

        <br>

        <input
          type="number"
          id="score_${escapeAttribute(s.id)}"
          value="${escapeAttribute(s.score || '')}"
          placeholder="คะแนน"
        >

        <button
          onclick="saveScore(
            '${escapeJsString(url)}',
            '${escapeJsString(s.id)}'
          )"
        >
          บันทึกคะแนน
        </button>

      </div>
    `;
  });

  workBox.innerHTML =
    html || `<div class="status-box">ไม่พบข้อมูลตามตัวกรอง</div>`;
}


// ===============================
// บันทึกคะแนน
// ===============================
function saveScore(url, studentId){

  const scoreInput = document.getElementById("score_" + studentId);

  if(!scoreInput){
    alert("ไม่พบช่องกรอกคะแนน");
    return;
  }

  const score = scoreInput.value;

  fetch(
    API_URL
    + "?action=updateScore"
    + "&url="
    + encodeURIComponent(url)
    + "&studentId="
    + encodeURIComponent(studentId)
    + "&score="
    + encodeURIComponent(score)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){
      alert("✅ บันทึกคะแนนแล้ว");
    }

    else{
      alert("❌ " + (data.message || "บันทึกคะแนนไม่สำเร็จ"));
    }
  })

  .catch(error => {
    console.error(error);
    alert("❌ เชื่อมต่อ API ไม่สำเร็จ");
  });
}


// ===============================
// สร้างตัวเลือกห้องเรียนอัตโนมัติ
// ===============================
function populateClassFilter(data){

  const select = document.getElementById("classFilter");

  const classes = [
    ...new Set(
      data
        .map(item => item.class)
        .filter(Boolean)
    )
  ];

  let html = `<option value="">ทุกห้อง</option>`;

  classes.forEach(c => {
    html += `
      <option value="${escapeHtml(c)}">
        ${escapeHtml(c)}
      </option>
    `;
  });

  select.innerHTML = html;

  select.onchange = function(){
    const url = document.getElementById("topic").value;
    renderWorkCards(currentWorkData, url);
  };

  document.getElementById("noFilter").oninput = function(){
    const url = document.getElementById("topic").value;
    renderWorkCards(currentWorkData, url);
  };
}


// ===============================
// แปลง Google Drive URL ให้แสดงรูปได้
// ===============================
function convertDriveImageUrl(url){

  if(!url) return "";

  url = String(url).trim();

  // กรณีลิงก์ /file/d/FILE_ID/view
  const matchDriveFile = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(matchDriveFile && matchDriveFile[1]){
    const fileId = matchDriveFile[1];
    return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1000";
  }

  // กรณีลิงก์มี ?id=FILE_ID
  const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(matchId && matchId[1]){
    const fileId = matchId[1];
    return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1000";
  }

  // ถ้าเป็น direct image URL อยู่แล้ว
  return url;
}


// ===============================
// ป้องกัน HTML แตกจากข้อมูลในชีท
// ===============================
function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJsString(value){

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");
}


// ===============================
// Matrix Background
// ===============================
const canvas =
  document.getElementById("matrix");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters =
  "アイウエオ0123456789";

const fontSize = 16;

const columns =
  Math.floor(canvas.width / fontSize);

const drops = [];

for(let i = 0; i < columns; i++){
  drops[i] = 1;
}

function draw(){

  ctx.fillStyle =
    "rgba(0,0,0,0.05)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#00ff41";

  ctx.font =
    fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text =
      letters[
        Math.floor(
          Math.random() * letters.length
        )
      ];

    ctx.fillText(
      text,
      i * fontSize,
      drops[i] * fontSize
    );

    if(
      drops[i] * fontSize > canvas.height &&
      Math.random() > 0.975
    ){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 33);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

</script>

</body>
</html>
