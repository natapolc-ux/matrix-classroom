<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{
  width:300px;
  margin:100px auto;
  background:rgba(0,0,0,0.8);
  border:1px solid #00ff41;
  padding:20px;
  box-shadow:0 0 20px #00ff41;
}

input,select,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
}

button{
  cursor:pointer;
}

.card{
  border:1px solid #00ff41;
  margin:20px;
  padding:20px;
  background:#111;
  box-shadow:0 0 15px #00ff41;
}

img{
  max-width:250px;
}

</style>

</head>
<body>

<canvas id="matrix"></canvas>

<div class="login-box" id="loginBox">

<h2>LOGIN</h2>

<input id="id" placeholder="Student ID">

<input id="pass"
       type="password"
       placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

<p id="msg"></p>

</div>

<div id="teacherPanel"
     style="display:none;padding:20px;">

<h2>Teacher Dashboard</h2>

<select id="topic"></select>

<select id="classFilter">
  <option value="">ทุกห้อง</option>
</select>

<input id="noFilter"
       type="number"
       placeholder="เลขที่">

<button onclick="loadWork()">
โหลดงาน
</button>

<div id="work"></div>

</div>

<div id="studentPanel"
     style="display:none;padding:20px;">

<h2>Student Dashboard</h2>

<div id="studentData"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzeqAOJCH6DYu7_A0VzscY5mWYn4uXwGMzxsnmFaB00knp7CI4RBfS_EXI6P00OmXbhvQ/exec";

function login(){

  const id = document
    .getElementById("id")
    .value;

  const pass = document
    .getElementById("pass")
    .value;

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + id
    + "&pass=" + pass
  )

  .then(res => res.json())

  .then(data => {

    if(data.status == "success"){

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(data.role == "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
      }

      else{

        document
          .getElementById("studentPanel")
          .style.display = "block";

        document
          .getElementById("studentData")
          .innerHTML =
          "Welcome " + data.name;
      }
    }

    else{

      document
        .getElementById("msg")
        .innerHTML = "❌ Login Failed";
    }
  });
}

function loadTopics(){

  fetch(API_URL + "?action=topics")

  .then(res => res.json())

  .then(data => {

    let html = "";

    data.forEach(t => {

      html += `
      <option value="${t.url}">
      ${t.level} - ${t.topic}
      </option>`;
    });

    document
      .getElementById("topic")
      .innerHTML = html;
  });
}

function loadWork(){

  const url = document
    .getElementById("topic")
    .value;

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
  )

  .then(res => res.json())

  .then(data => {

    let html = "";

    const classFilter =
      document
      .getElementById("classFilter")
      .value;

    const noFilter =
      document
      .getElementById("noFilter")
      .value;

    data.forEach(s => {

      if(classFilter &&
         s.class != classFilter)
        return;

      if(noFilter &&
         s.no != noFilter)
        return;

      html += `

      <div class="card">

      <h3>
      ${s.class}
      เลขที่ ${s.no}
      </h3>

      <p>${s.name}</p>

      <img src="${s.image}">

      <br><br>

      <input
        type="number"
        id="score_${s.id}"
        value="${s.score || ''}"
        placeholder="คะแนน">

      <button
        onclick="saveScore(
          '${url}',
          '${s.id}'
        )">

      บันทึกคะแนน

      </button>

      </div>
      `;
    });

    document
      .getElementById("work")
      .innerHTML = html;
  });
}

function saveScore(url,studentId){

  const score = document
    .getElementById(
      "score_" + studentId
    )
    .value;

  fetch(
    API_URL
    + "?action=updateScore"
    + "&url="
    + encodeURIComponent(url)
    + "&studentId="
    + studentId
    + "&score="
    + score
  )

  .then(res => res.json())

  .then(data => {

    if(data.status == "success"){
      alert("บันทึกคะแนนแล้ว");
    }

    else{
      alert("ผิดพลาด");
    }
  });
}

const canvas =
  document.getElementById("matrix");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters =
  "アイウエオ0123456789";

const fontSize = 16;

const columns =
  canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
  drops[i] = 1;
}

function draw(){

  ctx.fillStyle =
    "rgba(0,0,0,0.05)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#00ff41";

  ctx.font =
    fontSize + "px monospace";

  for(let i=0;i<drops.length;i++){

    const text =
      letters[
        Math.floor(
          Math.random()*letters.length
        )
      ];

    ctx.fillText(
      text,
      i*fontSize,
      drops[i]*fontSize
    );

    if(
      drops[i]*fontSize > canvas.height
      && Math.random() > 0.975
    ){
      drops[i]=0;
    }

    drops[i]++;
  }
}

setInterval(draw,33);

</script>

</body>
</html>
